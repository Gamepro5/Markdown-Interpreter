name: Release

# Builds the installers natively on each platform and attaches them to a
# GitHub Release. Tauri cannot cross-compile — the Linux bundles need
# webkit2gtk and the Windows one needs the NSIS toolchain — so each platform
# gets its own runner, which is what build_all.bat does locally with WSL.
#
# Three ways in, because all three are things a person actually does:
#   - Actions -> Release -> Run workflow, and leave the box empty. The last
#     released version gets its patch number bumped, the tag is made for you,
#     and the commit you ran it from is what ships. Nothing to type, nothing
#     to bump, nothing to commit first.
#   - push a tag:            git tag v1.0.1 && git push origin v1.0.1
#   - publish a release through the GitHub web UI
#
# Tag names are matched with and without the leading v. A tag matching neither
# pattern silently does nothing, which is a miserable way to spend an evening.
#
# Whichever way in, the tag is the version: it is stamped over the version in
# tauri.conf.json, package.json and Cargo.toml in the runner's checkout, so
# they cannot disagree and no commit is needed to keep them in step.

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release. Leave blank to bump the last one.'
        required: false

permissions:
  contents: write

# Tagging and then publishing a release from that tag fires twice. Let the
# second run wait rather than race the first one's asset uploads.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decide what this release is called, and make sure a tag by that name
  # exists on the commit being released.
  #
  # Leaving the box blank takes the last released version and adds one to its
  # patch number. The only thing that has to be true of a version is that it is
  # higher than the last one, because that is all the in-app updater compares.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A tag push or a published release already names itself.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "releasing ${{ github.ref_name }} (named by the trigger)"
            exit 0
          fi

          asked="${{ inputs.tag }}"
          if [ -n "$asked" ]; then
            tag="$asked"
          else
            # Newest release, or 0.0.0 if this is the first.
            last=$(gh release list --limit 1 --json tagName \
                     --jq '.[0].tagName // "0.0.0"' 2>/dev/null || echo "0.0.0")
            tag=$(echo "${last#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            echo "last release was '${last}', so this one is '${tag}'"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Point the tag at the commit this run was started from. `--force`
          # so a release that failed to build can be retried on a newer commit
          # under the same name, which is the common case after a fix.
          git tag --force "$tag" "${{ github.sha }}"
          git push --force origin "refs/tags/$tag"
          echo "tagged ${{ github.sha }} as $tag"

  build:
    needs: version
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest: it has glibc 2.35 and webkit2gtk-4.1,
          # so the .deb and the AppImage also run on Ubuntu 22.04, Debian 12
          # and anything newer. Building on 24.04 raises the floor for no gain.
          - os: ubuntu-22.04
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config patchelf \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -V && cargo -V

      # The tag *is* the version.
      #
      # The in-app updater decides whether it is out of date by comparing its
      # own version against the newest published tag. If the two disagree,
      # every install believes it is behind for ever and offers the same update
      # on every launch — so rather than checking they match, one is derived
      # from the other. Nothing is committed back; the stamp lives only in the
      # runner's checkout.
      - name: Stamp the version from the tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          # v1.2 and 1.2 are the same tag; 1.2 and 1.2.0 are the same version.
          # Tauri stamps the installers from tauri.conf.json and wants x.y.z.
          version=$(echo "${tag#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}')

          # JSON through node, which is on every runner once setup-node has run,
          # rather than trusting sed with nested objects.
          VERSION="$version" node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const edit = (file, fn) => {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              fn(json);
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            };
            edit("src-tauri/tauri.conf.json", (j) => { j.version = v; });
            edit("package.json", (j) => { j.version = v; });
            edit("package-lock.json", (j) => {
              j.version = v;
              if (j.packages && j.packages[""]) j.packages[""].version = v;
            });
          '

          # Only the first `version = "…"`, which is [package]'s. A plain global
          # replace would rewrite every dependency pin below it.
          sed -i '0,/^version = ".*"/s//version = "'"$version"'"/' src-tauri/Cargo.toml

          # Cargo.lock records the crate's own version too. Edited as text, as
          # cargo would need the registry index to re-resolve it.
          awk -v v="$version" '
            /^name = "markdown-interpreter"$/ { print; want = 1; next }
            want && /^version = "/             { print "version = \"" v "\""; want = 0; next }
                                               { print }
          ' src-tauri/Cargo.lock > src-tauri/Cargo.lock.stamped
          mv src-tauri/Cargo.lock.stamped src-tauri/Cargo.lock

          # Confirm every file landed. A silent miss ships installers that call
          # themselves the wrong version, and an updater that never settles.
          conf=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          pkg=$(node -p 'require("./package.json").version')
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          lock=$(awk '/^name = "markdown-interpreter"$/ { getline; print }' src-tauri/Cargo.lock)
          echo "tag $tag -> $version | tauri.conf.json $conf | package.json $pkg | Cargo.toml $crate | Cargo.lock $lock"
          for have in "$conf" "$pkg" "$crate"; do
            [ "$have" = "$version" ] || { echo "::error::Version stamping missed a file (see the line above)."; exit 1; }
          done
          [ "$lock" = "version = \"$version\"" ] || { echo "::error::Version stamping missed Cargo.lock."; exit 1; }

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - run: npm ci

      # The npm-published CLI is a prebuilt binary, so this takes seconds where
      # `cargo install tauri-cli` takes minutes compiling it from source.
      #
      # tauri.conf.json has a beforeBuildCommand of `npm run bundle`, so the
      # esbuild step runs as part of this.
      - name: Build the bundles
        shell: bash
        env:
          # appimagetool wants FUSE, which a runner does not have. Extracting
          # and running it directly is the supported way out.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx --yes '@tauri-apps/cli@^2' build --verbose

      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.tag }}"
          out="dist"
          mkdir -p "$out"
          bundle="src-tauri/target/release/bundle"

          # Tauri names its output after the product name, which has a space in
          # it, and GitHub turns spaces in asset names into dots. Rename to
          # something predictable. The in-app updater finds its file by these
          # suffixes (-x86_64-setup.exe, -x86_64.AppImage), so keep them.
          copy() {
            local src="$1" ext="$2"
            [ -f "$src" ] || return 0
            cp "$src" "$out/Markdown-Interpreter-${version}-x86_64.${ext}"
            echo "  $(basename "$src")  ->  Markdown-Interpreter-${version}-x86_64.${ext}"
          }

          if [ "${{ runner.os }}" = "Windows" ]; then
            # -setup so it is obvious this is an installer, not the app itself.
            for f in "$bundle"/nsis/*-setup.exe; do
              [ -f "$f" ] || continue
              cp "$f" "$out/Markdown-Interpreter-${version}-x86_64-setup.exe"
              echo "  $(basename "$f")"
            done
          else
            for f in "$bundle"/deb/*.deb; do copy "$f" deb; done
            for f in "$bundle"/rpm/*.rpm; do copy "$f" rpm; done
            for f in "$bundle"/appimage/*.AppImage; do copy "$f" AppImage; done
          fi

          echo "Collected:"
          ls -l "$out"
          # An empty dist means the bundler changed its output paths and this
          # step quietly copied nothing, which must not reach a release.
          [ -n "$(ls -A "$out")" ] || { echo "::error::No installers were produced. Look at the bundle step's output for where they went."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The in-app updater checks every download against this file as well as
      # against the digest GitHub publishes for each asset.
      - name: Checksums
        run: |
          cd dist
          sha256sum Markdown-Interpreter-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Always a draft: a release is public the moment it exists, and a bad
      # installer cannot be unpublished from the people who already have it.
      # The in-app updater ignores drafts, so nobody is offered this until it
      # is published. Check the files, edit the notes, then press Publish.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # Title is just the version: the repo name is already all over the
            # page. NOTE the comment sits above the command - a comment after a
            # "\" continuation swallows it, and the command then runs without
            # the arguments that followed.
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --draft
          fi
